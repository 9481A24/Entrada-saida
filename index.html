<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle 6 Meses</title>

<style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        text-align: center;
    }
    th, td {
        border: 1px solid black;
        padding: 6px;
    }
    button {
        padding: 4px 10px;
        cursor: pointer;
    }
    .valor, .saida {
        width: 100%;
        box-sizing: border-box;
        padding: 4px;
        border: none;
        text-align: right;
    }
    #totais {
        margin-top: 25px;
        font-size: 20px;
        font-weight: bold;
        line-height: 34px;
    }

    /* cores sábados e domingos */
    .sabado {
        background-color: #fff3a3;
    }
    .domingo {
        background-color: #bcd7ff;
    }

    /* --- SOMENTE IMPRESSÃO DA TABELA --- */
    @media print {
        body * {
            visibility: hidden;
        }
        #areaImprimir, #areaImprimir * {
            visibility: visible;
        }
        #areaImprimir {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }
    }
</style>

</head>
<body>

<button onclick="window.print()">Imprimir Planilha</button>

<div id="areaImprimir">
<h2>Controle Financeiro — Período 10/11/2025 até 10/05/2026</h2>

<table id="tabelaDatas">
    <tr>
        <th>Data</th>
        <th>Origem</th>
        <th>Entrada</th>
        <th>Saída</th>
        <th>Ação</th>
    </tr>
</table>

<div id="totais">
    ENTRADAS: R$ 0,00 <br>
    SAÍDAS: R$ 0,00 <br>
    SALDO FINAL: R$ 0,00
</div>
</div>

<script>
    function gerarDatas() {
        let tabela = document.getElementById("tabelaDatas");

        let inicio = new Date(2025, 10, 10); // 10/11/2025
        let fim = new Date(2026, 4, 10);     // 10/05/2026

        while (inicio <= fim) {

            let dia = String(inicio.getDate()).padStart(2, '0');
            let mes = String(inicio.getMonth() + 1).padStart(2, '0');
            let ano = inicio.getFullYear();

            let tr = document.createElement("tr");

            let diaSemana = inicio.getDay(); // 0 domingo, 6 sábado

            if (diaSemana === 6) tr.classList.add("sabado");
            if (diaSemana === 0) tr.classList.add("domingo");

            tr.innerHTML = `
                <td>${dia}/${mes}/${ano}</td>
                <td contenteditable="true"></td>
                <td><input type="text" class="valor" placeholder="0,00"></td>
                <td><input type="text" class="saida" placeholder="0,00"></td>
                <td><button onclick="apagar(this)">Apagar</button></td>
            `;

            tabela.appendChild(tr);

            inicio.setDate(inicio.getDate() + 1);
        }

        document.querySelectorAll('.valor').forEach(inp => inp.addEventListener('input', somar));
        document.querySelectorAll('.saida').forEach(inp => inp.addEventListener('input', somar));
    }

    function formatar(v) {
        let t = v.trim().replace(/[^\d,.-]/g, '');
        t = t.replace(/\./g, '').replace(',', '.');
        let n = parseFloat(t);
        if (isNaN(n)) return 0;
        return n;
    }

    function somar() {
        let entradas = 0;
        let saidas = 0;

        document.querySelectorAll(".valor").forEach(v => {
            entradas += formatar(v.value);
        });

        document.querySelectorAll(".saida").forEach(v => {
            saidas += formatar(v.value);
        });

        let saldo = entradas - saidas;

        document.getElementById("totais").innerHTML = `
            ENTRADAS: R$ ${entradas.toFixed(2).replace('.', ',')} <br>
            SAÍDAS: R$ ${saidas.toFixed(2).replace('.', ',')} <br>
            SALDO FINAL: R$ ${saldo.toFixed(2).replace('.', ',')}
        `;
    }

    function apagar(botao) {
        botao.parentElement.parentElement.remove();
        somar();
    }

    gerarDatas();
</script>

</body>
</html>
