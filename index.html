<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Financeiro Completo</title>
<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f2f2f2;
}
h2 { margin-top:0; }

.box {
    background: #fff;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 0 5px #aaa;
    margin-bottom: 20px;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: #2ecc71;
    color: #fff;
    font-weight: bold;
    border: none;
}

.removeBtn {
    background: #ff3b3b;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    margin-left: 10px;
}

.totalBox {
    background: #2a7df0;
    color: white;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    margin-top: 20px;
}
.saldoBox {
    background: #111;
    color: #fff;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    margin-top: 10px;
    font-size: 22px;
    font-weight: bold;
}
</style>
</head>
<body>

<h2>Controle Financeiro Completo</h2>

<!-- ENTRADAS -->
<div class="box">
    <h3>Adicionar ENTRADA (ganho)</h3>
    <input type="number" id="valorEntrada" placeholder="Valor da entrada (R$)">
    <button onclick="adicionarEntrada()">Adicionar Entrada</button>
</div>

<!-- SAÍDAS -->
<div class="box">
    <h3>Adicionar SAÍDA (gasto)</h3>
    <input type="number" id="valorSaida" placeholder="Valor da saída (R$)">
    <button onclick="adicionarSaida()">Adicionar Saída</button>
</div>

<!-- LISTA DE ENTRADAS -->
<div class="box">
    <h3>Entradas</h3>
    <div id="listaEntradas"></div>
</div>

<!-- LISTA DE SAÍDAS -->
<div class="box">
    <h3>Saídas</h3>
    <div id="listaSaidas"></div>
</div>

<!-- TOTAL -->
<div class="totalBox">
    <p>Total Entradas: R$ <span id="totalEntradas">0</span></p>
    <p>Total Saídas: R$ <span id="totalSaidas">0</span></p>
</div>

<!-- SALDO FINAL -->
<div class="saldoBox">
    Saldo: R$ <span id="saldoFinal">0</span>
</div>

<script>
// Carrega tudo salvo
let dados = JSON.parse(localStorage.getItem("financeiroCompleto")) || {
    entradas: [],
    saídas: []
};

function salvar() {
    localStorage.setItem("financeiroCompleto", JSON.stringify(dados));
}

/* --------- ADICIONAR ENTRADA --------- */
function adicionarEntrada() {
    let valor = document.getElementById("valorEntrada").value;

    if (valor === "") {
        alert("Digite o valor da entrada!");
        return;
    }

    dados.entradas.push({
        valor: Number(valor),
        data: new Date().toLocaleDateString()
    });

    document.getElementById("valorEntrada").value = "";
    salvar();
    mostrar();
}

/* --------- ADICIONAR SAÍDA --------- */
function adicionarSaida() {
    let valor = document.getElementById("valorSaida").value;

    if (valor === "") {
        alert("Digite o valor da saída!");
        return;
    }

    dados.saídas.push({
        valor: Number(valor),
        data: new Date().toLocaleDateString()
    });

    document.getElementById("valorSaida").value = "";
    salvar();
    mostrar();
}

/* --------- REMOVER ENTRADA --------- */
function removerEntrada(i) {
    dados.entradas.splice(i, 1);
    salvar();
    mostrar();
}

/* --------- REMOVER SAÍDA --------- */
function removerSaida(i) {
    dados.saídas.splice(i, 1);
    salvar();
    mostrar();
}

/* --------- MOSTRAR LISTAS E TOTAIS --------- */
function mostrar() {
    let listaE = document.getElementById("listaEntradas");
    let listaS = document.getElementById("listaSaidas");

    listaE.innerHTML = "";
    listaS.innerHTML = "";

    let totE = 0;
    let totS = 0;

    // ENTRADAS
    dados.entradas.forEach((e, i) => {
        totE += e.valor;
        listaE.innerHTML += `
            <p>📅 ${e.data} — 💰 R$${e.valor}
            <button class="removeBtn" onclick="removerEntrada(${i})">Apagar</button></p>
        `;
    });

    // SAÍDAS
    dados.saídas.forEach((s, i) => {
        totS += s.valor;
        listaS.innerHTML += `
            <p>📅 ${s.data} — ❌ R$${s.valor}
            <button class="removeBtn" onclick="removerSaida(${i})">Apagar</button></p>
        `;
    });

    // TOTAIS
    document.getElementById("totalEntradas").innerText = totE.toFixed(2);
    document.getElementById("totalSaidas").innerText = totS.toFixed(2);

    // SALDO FINAL
    document.getElementById("saldoFinal").innerText = (totE - totS).toFixed(2);
}

// Exibir ao carregar
mostrar();
</script>

</body>
</html>
