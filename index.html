<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle 6 Meses</title>

<style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        text-align: center;
    }
    th, td {
        border: 1px solid black;
        padding: 6px;
    }
    button {
        padding: 4px 10px;
        cursor: pointer;
    }
    #totalGeral {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
    }
    input.valor {
        width: 100%;
        box-sizing: border-box;
        padding: 4px;
        border: none;
        text-align: right;
    }
</style>

</head>
<body>

<h2>Controle Financeiro — Período 10/11/2025 até 10/05/2026</h2>

<table id="tabelaDatas">
    <tr>
        <th>Data</th>
        <th>Origem</th>
        <th>Valor</th>
        <th>Ação</th>
    </tr>
</table>

<div id="totalGeral">TOTAL: R$ 0,00</div>

<script>
    function gerarDatas() {
        let tabela = document.getElementById("tabelaDatas");

        let inicio = new Date(2025, 10, 10); // 10/11/2025
        let fim = new Date(2026, 4, 10);     // 10/05/2026

        while (inicio <= fim) {

            let dia = String(inicio.getDate()).padStart(2, '0');
            let mes = String(inicio.getMonth() + 1).padStart(2, '0');
            let ano = inicio.getFullYear();

            let tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${dia}/${mes}/${ano}</td>
                <td contenteditable="true"></td>
                <td><input type="text" class="valor" placeholder="0,00"></td>
                <td><button onclick="apagar(this)">Apagar</button></td>
            `;

            tabela.appendChild(tr);

            inicio.setDate(inicio.getDate() + 1);
        }

        // adiciona listeners de input em todos os campos valor
        document.querySelectorAll('.valor').forEach(inp => {
            inp.addEventListener('input', somar);
            // também limpa espaços indesejados ao sair do campo
            inp.addEventListener('blur', () => {
                inp.value = formatarMoedaInput(inp.value);
                somar();
            });
        });
    }

    function formatarMoedaInput(text) {
        // Remove tudo que não é número, vírgula ou ponto, depois transforma em formato com vírgula
        let cleaned = String(text).trim().replace(/[^\d,.\-]/g, '');
        if (cleaned === '') return '';
        // transformar vírgula em ponto pra parseFloat
        cleaned = cleaned.replace(/,/, '.');
        let n = parseFloat(cleaned);
        if (isNaN(n)) return '';
        // formatar com duas casas e vírgula
        return n.toFixed(2).replace('.', ',');
    }

    function somar() {
        let valores = document.querySelectorAll(".valor");
        let total = 0;

        valores.forEach(v => {
            let txt = v.value.trim();
            if (txt === '') return;
            // aceita "1.234,56" ou "1234.56" ou "1234,56"
            // padroniza: remove pontos de milhar, troca vírgula por ponto
            let pad = txt.replace(/\./g, '').replace(',', '.');
            let n = parseFloat(pad);
            if (!isNaN(n)) total += n;
        });

        // mostra com vírgula e 2 decimais
        document.getElementById("totalGeral").innerText =
            "TOTAL: R$ " + total.toFixed(2).replace('.', ',');
    }

    function apagar(botao) {
        let tr = botao.parentElement.parentElement;
        tr.remove();
        somar();
    }

    gerarDatas();
</script>

</body>
</html>
